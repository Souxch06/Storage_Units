# =====================================================================
#  Recettes de craft des unités de stockage.
#
#  IMPORTANT : TOUTES les recettes de ce fichier sont désactivées par
#  défaut (enabled: false). Les développeurs / admins du serveur peuvent
#  les activer, les modifier ou en ajouter librement.
#
#  Activez-les au niveau de la config principale (config.yml -> craft.enabled)
#  ET/OU au niveau de chaque recette ci-dessous. Les deux doivent être à
#  true pour que la recette soit enregistrée dans le registre du serveur.
# =====================================================================

craft:
  # Le booléen global craft.enabled de config.yml doit aussi être à true.
  # Laissez les recettes à enabled: false ci-dessous pour fournir des
  # EXEMPLES / TEMPLATES prêts à activer en une seule modification.
  enabled: false  # -> se règle aussi dans config.yml (craft.enabled)

recipes:

  # ----------------------------------------------------------------
  #  Exemple 1 : recette de base (coffre + 4 lingots de fer)
  #  Décommentez / passez à enabled: true pour l'activer.
  # ----------------------------------------------------------------
  basic_chest:
    enabled: false         # <- mettre à true pour activer
    level: 1               # niveau de l'unité donnée par le craft
    amount: 1              # quantité d'unités données par craft
    shape:
      - "III"
      - "ICI"
      - "III"
    ingredients:
      I: IRON_INGOT
      C: CHEST

  # ----------------------------------------------------------------
  #  Exemple 2 : recette avancée (niveau 2)
  # ----------------------------------------------------------------
  advanced_chest:
    enabled: false
    level: 2
    amount: 1
    shape:
      - "DGD"
      - "DCD"
      - "DGD"
    ingredients:
      D: DIAMOND
      G: GOLD_INGOT
      C: CHEST

  # ----------------------------------------------------------------
  #  Exemple 3 : recette "lite" (1 seul bloc de fer au centre)
  # ----------------------------------------------------------------
  simple_chest:
    enabled: false
    level: 1
    amount: 1
    shape:
      - "   "
      - " I "
      - "   "
    ingredients:
      I: IRON_BLOCK
