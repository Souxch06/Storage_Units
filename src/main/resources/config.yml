# =====================================================================
#  Storage Units - Configuration principale
#  Plugin Paper / Purpur 1.21.11+ - Compatible Java et Bedrock
# =====================================================================

settings:
  # Langue utilisée (fr, en, etc.). Doit correspondre à un fichier lang/<lang>.yml
  language: "fr"
  # Niveau donné par défaut aux nouvelles unités (commande /su give)
  default-level: 1
  # Nombre maximum d'objets déplaçables en une seule action de l'interface
  max-stacks-per-click: 2304

# ---------- Niveaux des unités ----------
# Chaque niveau définit la capacité maximale d'une unité.
# Le système est complètement extensible : ajoutez autant de niveaux que
# vous le souhaitez, sans modifier le code du plugin.
levels:
  1:
    capacity: 512
    display-name: "Niveau 1"
  2:
    capacity: 2048
    display-name: "Niveau 2"
  3:
    capacity: 8192
    display-name: "Niveau 3"
  4:
    capacity: 32768
    display-name: "Niveau 4"
  5:
    capacity: 131072
    display-name: "Niveau 5"

# ---------- Apparence de l'item "Unité de stockage" ----------
#
# IMPORTANT : par défaut, le bloc posé est un coffre VANILLA pour rester
# immédiatement compatible avec Bedrock (Geyser/Floodgate). Pour le
# différencier visuellement d'un coffre classique, on s'appuie sur :
#   - le nom custom (en or, avec un préfixe distinctif)
#   - le lore (description + tags de couleur)
#   - l'effet "glowing" (enchantement invisible)
#   - un tag PersistentDataContainer (storageunits:unit_item) côté serveur
#
# Les développeurs qui souhaitent un modèle 3D / texture différent peuvent
# fournir leur propre pack de ressources et renseigner `custom-model-data`
# (0 = aucun, le bloc utilise alors la texture vanilla du coffre).
#
# /!\ Si vous activez `custom-model-data`, Bedrock via Geyser peut afficher
# le coffre vanilla par défaut (CustomModelData pas encore 100 % supporté
# sur Bedrock). Gardez 0 pour une compatibilité parfaite Java + Bedrock.
unit:
  # Matériau du bloc posé : CHEST (vanilla) = visible à l'identique Java & Bedrock
  material: CHEST
  # Nom de l'item. Le préfixe distinctif évite toute confusion avec un coffre vanilla.
  name: "&6&l✦ Unité de stockage"
  # Lore. Les placeholders {level} et {capacity} sont automatiquement remplacés
  # à la création de l'item en fonction du niveau donné.
  lore:
    - "&7&oCoffre de stockage intelligent"
    - "&7&opeut contenir jusqu'à &e{capacity} &7&oobjets"
    - "&7&od'un seul type à la fois."
    - ""
    - "&8▸ Niveau : &e{level}"
    - "&8▸ Capacité : &e{capacity}"
    - ""
    - "&8&l[Storage Units] &7&oClic droit pour placer"
    - "&7&oCompatible Java & Bedrock"
  # Apparence brillante dans l'inventaire (enchantement invisible)
  glowing: true
  # CustomModelData. 0 = aucun (apparence vanilla). Voir note ci-dessus.
  custom-model-data: 0

# ---------- Craft ----------
# Les recettes sont DÉSACTIVÉES PAR DÉFAUT (enabled: false) pour que les
# développeurs / admins puissent décider eux-mêmes de comment les joueurs
# obtiennent une unité : commande /su give, loot table, autre plugin, etc.
#
# Pour les activer ou en ajouter, éditez le fichier recipes.yml à la racine
# du dossier du plugin (plugins/StorageUnits/recipes.yml). Mettez simplement
# `enabled: true` sur la recette de votre choix.
craft:
  # true  -> enregistre les recettes actives de recipes.yml au démarrage du serveur
  # false -> AUCUNE recette n'est ajoutée. Les unités sont obtenues via
  #          /su give, /su give <joueur> [niveau] ou tout autre moyen.
  enabled: false

# ---------- Sons ----------
# Toutes les clés sont facultatives. En cas d'erreur, un son par défaut
# est utilisé.
sounds:
  open: BLOCK_CHEST_OPEN
  close: BLOCK_CHEST_CLOSE
  deposit: ENTITY_ITEM_PICKUP
  withdraw: ENTITY_ITEM_PICKUP
  upgrade: ENTITY_PLAYER_LEVELUP

# ---------- Messages ----------
# Utilisés par les commandes et l'interface. Les codes & couleur sont
# supportés. Si une clé est absente, le plugin utilise une valeur par
# défaut interne.
messages:
  placed: "&aVous avez placé une unité de stockage (niveau {level})."
  already-here: "&cUne unité est déjà présente à cet emplacement."
  no-permission: "&cVous n'avez pas la permission."
  deposit: "&aVous avez déposé {amount} objet(s)."
  deposit-failed: "&cVous ne pouvez rien déposer ici."
  deposit-ambiguous: "&cPlusieurs types d'objets détectés. Déposez d'abord un stack manuellement pour choisir le type."
  withdraw-all: "&aVous avez retiré {amount} objet(s)."
  upgrade-success: "&aUnité améliorée au niveau {level} !"
  upgrade-max: "&7Cette unité est au niveau maximum."
  upgrade-too-full: "&cVidez l'unité avant de l'améliorer."
  give-success: "&aVous avez donné une unité de niveau {level} à {player}."
  give-received: "&aVous avez reçu une unité de stockage (niveau {level})."
  specify-player: "&cSpécifiez un joueur."
  player-not-found: "&cJoueur introuvable : {player}"
  invalid-number: "&cNombre invalide : {value}"
  invalid-level: "&cNiveau invalide : {level}"
  reload-success: "&aConfiguration rechargée."
  craft-disabled: "&cLe craft des unités est désactivé. Utilisez /su give."
  list-header: "&6Liste des unités (page {page})"
  list-empty: "&7Aucune unité sur cette page."
  status-units: "&7Unités chargées : &e{count}"
  status-total: "&7Objets stockés : &e{total}"
  status-capacity: "&7Capacité totale : &e{cap}"
